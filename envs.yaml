# Hub environments for the reward-robustness audit.
# Picked: single-turn tasks scored on CPU (math, logic, QA, formatting), no sandbox, GPU, LLM judge or network.
# Each was installed and its ground-truth reference scored with the checker's own worker before selection.
verifiers_venvs:
  .venvs/hub: verifiers 0.3.1 (classic + v1 APIs)
  .venvs/gsm8k: verifiers 0.3.1, isolated (wheel installs a root pyproject.toml)
  .venvs/v012: verifiers 0.1.12 (envs whose plain-string task column 0.3.1 rejects)
selected:
- env_id: primeintellect/math500
  load_id: math500
  api: v1
  venv: .venvs/hub
  env_args: {}
  split: train
  dataset_size: 500
  category: math
  reward_kind: binary
  max_reward: 1
  answer_field: answer
  reference_template: The final answer is \boxed{{{answer}}}.
  strict_check:
    kind: boxed
    arg: null
    normalize: Use only the text after the last '</think>' (score 0 if '<think>' is unclosed). Take the content
      of the last balanced \boxed{...}. Strip whitespace and a trailing period. Drop \left/\right, \! and spacing
      commands, '^\circ'/'^{\circ}', '\text{...}' unit words, '\dfrac'->'\frac' and surrounding '$'. Compare to
      the gold normalized the same way, falling back to numeric/fraction equality (e.g. 0.5 == \frac{1}{2}) and
      to ordered-tuple equality for coordinates.
  task: MATH-500 competition math (HuggingFaceH4/MATH-500 test split, pinned revision). The prompt is the problem
    plus 'Please reason step by step, and put your final answer within \boxed{}.' The model must box the final answer.
  reward: 'One reward: Math500Task.correct, weight 1.0 = vf.verify_boxed_math_answer(trace.last_reply, data.answer)
    from verifiers/v1/utils/score.py. It returns 0 if the reply contains ''<think>'' without ''</think>''. Otherwise
    it takes the text after the last ''</think>'', extracts the content of the LAST \boxed{...} (strict, brace-balanced,
    '''' if there is no box), extracts the gold the same way (falling back to the raw gold), and runs math_verify
    parse(''\boxed{gold}'') vs parse(''\boxed{pred}'') with verify() and 5s timeouts. Any exception scores 0. Binary,
    so full credit is 1.0.'
  why: single-turn math with a checkable final answer; scored on CPU
  reference_check: 10/10 spread rows score > 0 with the reference template
- env_id: will/gsm8k
  load_id: gsm8k
  api: legacy
  venv: .venvs/gsm8k
  env_args: {}
  split: train
  dataset_size: 7473
  category: math
  reward_kind: binary
  max_reward: 1
  answer_field: answer
  reference_template: The final answer is \boxed{{{answer}}}.
  strict_check:
    kind: boxed
    arg: null
    normalize: Take the last balanced \boxed{} content of the final assistant message, with no box meaning no answer.
      Strip whitespace, '$' and a trailing period, and remove thousands-separator commas. Compare as an integer
      to the gold with commas removed. All gold values match -?[\d,]+.
  task: GSM8K grade-school math word problems (train 7473; eval/test 1319). The system prompt asks for step-by-step
    reasoning with the final answer in \boxed{}. The gold is the text after '####'.
  reward: 'RubricGroup with three rewards. (1) correct_answer_reward_func, weight 1.0: response = vf.Parser(extract_fn=extract_boxed_answer).parse_answer(completion)
    or ''''. It takes the last assistant message, then the last balanced \boxed{} content; it is NON-strict, so
    with no box (or an unclosed box) it returns the whole message text. Reward is 1.0 iff response == answer as
    an exact string match, with no strip or normalization. (2) format_reward_func, weight 0.0, always returns 1.0.
    (3) MultiTurnMonitorRubric.num_turns, weight 0. Max 1.0.'
  why: single-turn math with a checkable final answer; scored on CPU
  reference_check: 10/10 spread rows score > 0 with the reference template
