- env_id: sami/countdown
  load_id: countdown
  api: legacy
  venv: .venvs/v012
  env_args: {}
  split: train
  dataset_size: 400
  category: logic
  reward_kind: multi-component
  max_reward: 1.4
  answer_field: answer
  reference_template: '<reasoning>

    Combine the numbers step by step.

    </reasoning>

    <solution>

    {answer}

    </solution>'
  strict_check:
    kind: xml_tag
    arg: solution
    normalize: Take the <solution> tag content, stripped, and map unicode operators to ASCII. Allow only digits,
      + - * / ( ) and whitespace. Check that each integer literal comes from info.numbers at most once (multiset).
      Evaluate exactly with fractions, requiring every intermediate to be a positive integer, and require the result
      to equal info.target.
  task: 'Countdown numbers game: reach a target (101-999) from 6 source numbers using + - * / with each number used
    at most once. The answer goes in <reasoning>...</reasoning><solution>...</solution>. There are 400 train puzzles
    (seeded shuffle of the precomputed puzzles.json) and 80 eval puzzles. info holds numbers/target, and answer
    holds one reference solution expression.'
  reward: 'RubricGroup. Rubric (XMLParser fields reasoning, solution) has three rewards. (1) exact_match_reward,
    weight 1.0: validate_solution(solution, info.numbers, info.target). (2) closeness_reward, weight 0.3: 0.5**(|eval(solution)-target|/10),
